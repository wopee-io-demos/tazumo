version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      expo-sdk:
        patterns: [expo, expo-*, '@expo/*', react, react-dom, react-native, react-native-*]
      npm-minor-and-patch:
        update-types: [minor, patch]
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
