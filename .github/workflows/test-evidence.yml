name: Test evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  evidence:
    runs-on: ${{ (vars.RUNNER_MODE == 'hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","demos"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify changed files
        id: changes
        run: node scripts/ci-changes.mjs
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.guard == 'true'
        with:
          version: 10.11.0
      - if: steps.changes.outputs.web == 'true' || steps.changes.outputs.guard == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Runner guard (fork pull requests never on self-hosted runners)
        if: steps.changes.outputs.guard == 'true'
        run: node scripts/check-runner-guard.mjs
      - if: steps.changes.outputs.web == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright E2E, accessibility and failure scenarios
        if: steps.changes.outputs.web == 'true'
        run: pnpm test:e2e
      - name: Evidence summary
        if: always()
        env:
          WEB: ${{ steps.changes.outputs.web }}
          GUARD: ${{ steps.changes.outputs.guard }}
        run: |
          {
            echo "### Test evidence for ${GITHUB_SHA}"
            if [ "$WEB" = true ]; then
              echo "Browser evidence: Playwright Chromium against the Vite dev server. Fixture data only; no native device evidence."
              echo "Artifacts: \`playwright-report\` (HTML report with axe JSON and screenshots per test) and \`playwright-test-results\` (screenshots, traces on failure)."
            else
              echo "Playwright skipped: no web, package, e2e test or contract changes in this pull request."
            fi
            [ "$GUARD" = true ] && echo "Runner guard ran." || echo "Runner guard skipped: no workflow changes."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.web == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.web == 'true'
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
