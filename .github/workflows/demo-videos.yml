name: Demo flow videos
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/demo-videos.yml'
      - 'tests/demo/**'
      - '!tests/demo/**/*.md'
permissions:
  contents: read
concurrency:
  group: demo-videos-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MOBILECLI_VERSION: 1.0.24
jobs:
  web:
    name: Web demo video (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test -c tests/demo/playwright.config.ts
      - name: Convert to H.264
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          mkdir -p demo-videos
          ffmpeg -loglevel error -y -i test-results/demo/*/video.webm -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart demo-videos/tazumo-flow-web.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-demo-video-web
          path: |
            demo-videos/
            test-results/demo/
          retention-days: 30

  android:
    name: Android demo video (emulator, mobilecli)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test tests/demo/run-case.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release-variant APK (debug keystore, x86_64, embedded JS bundle)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - run: npm install -g mobilecli@${{ env.MOBILECLI_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the demo flow on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tests/demo/android-video.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ runner.temp }}/demo-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-demo-video-android
          path: ${{ runner.temp }}/demo-android/
          retention-days: 30
