name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/check-repo-policy.mjs
      - run: node scripts/validate-openapi.mjs
      - run: node scripts/check-sut-contract.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-web-dist
          path: apps/web/dist/
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
