name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ vars.RUNNER_MODE == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","demos"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate issue-status helper shell syntax
        run: bash -n scripts/issue-status.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: python3 scripts/check-agent-policy.py
      - run: node scripts/check-repo-policy.mjs
      - run: node scripts/validate-openapi.mjs
      - name: SUT contract (IDs in both apps, semantic version against the previous contract)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin -- "$BASE_REF"
            pnpm check:sut --base FETCH_HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin -- "$BEFORE"
            pnpm check:sut --base FETCH_HEAD
          else
            pnpm check:sut
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:mobile
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-web-dist
          path: apps/web/dist/
          retention-days: 7
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
