name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ${{ (vars.RUNNER_MODE == 'hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","demos"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify changed files
        id: changes
        run: node scripts/ci-changes.mjs
      - run: node --test scripts/ci-changes.test.mjs
      - name: Validate issue-status helper shell syntax
        run: bash -n scripts/issue-status.sh
      - run: python3 scripts/check-agent-policy.py
      - run: node scripts/check-repo-policy.mjs
      - run: node scripts/validate-openapi.mjs
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.code == 'true'
        with:
          version: 10.11.0
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: SUT contract (IDs in both apps, semantic version against the previous contract)
        if: steps.changes.outputs.code == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin -- "$BASE_REF"
            pnpm check:sut --base FETCH_HEAD
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin -- "$BEFORE"
            pnpm check:sut --base FETCH_HEAD
          else
            pnpm check:sut
          fi
      - if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.code == 'true'
        run: pnpm test
      - if: steps.changes.outputs.web == 'true'
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.web == 'true'
        with:
          name: tazumo-web-dist
          path: apps/web/dist/
          retention-days: 7
      - if: steps.changes.outputs.mobile == 'true'
        run: pnpm bundle:mobile
