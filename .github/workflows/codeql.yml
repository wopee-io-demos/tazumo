name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr-analysis:
    name: CodeQL PR analysis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          upload: never
          output: ${{ runner.temp }}/codeql-sarif
      - name: Fail on findings
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-sarif
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$SARIF_DIR"/*.sarif)
          [ ${#files[@]} -gt 0 ] || { echo "::error::CodeQL wrote no SARIF output"; exit 1; }
          jq -r '.runs[].results[]? | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri // "?"),line=\(.locations[0].physicalLocation.region.startLine // 1)::\(.ruleId): \(.message.text)"' "${files[@]}"
          count=$(jq -s '[.[].runs[].results[]?] | length' "${files[@]}")
          echo "CodeQL javascript-typescript findings: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$count" -eq 0 ]
  analyze:
    name: CodeQL analysis and upload
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
