name: Pages preview
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tests/pages/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - apps/web/vite.config.ts
      - tests/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false
env:
  TAZUMO_WEB_BASE: /tazumo/
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      entry: ${{ steps.entry.outputs.script }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile --filter '@tazumo/web...'
      - run: pnpm build
      - name: Built entry uses the Pages base path
        id: entry
        run: |
          script=$(grep -o 'src="[^"]*\.js"' apps/web/dist/index.html | head -1 | cut -d'"' -f2)
          case "$script" in "${TAZUMO_WEB_BASE}assets/"*) ;; *) echo "::error::entry script '$script' is not under ${TAZUMO_WEB_BASE}"; exit 1;; esac
          echo "script=$script" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Pages base path matches the build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: test "${BASE_PATH%/}/" = "$TAZUMO_WEB_BASE"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_URL: ${{ needs.deploy.outputs.url }}
      PAGES_QUERY: ?v=${{ github.sha }}
      ENTRY_SCRIPT: ${{ needs.build.outputs.entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the live URL serves this build
        run: |
          case "$PAGES_URL" in */) ;; *) PAGES_URL="$PAGES_URL/"; echo "PAGES_URL=$PAGES_URL" >> "$GITHUB_ENV";; esac
          for _ in $(seq 1 30); do
            if curl -fsS "${PAGES_URL}${PAGES_QUERY}" | grep -qF "$ENTRY_SCRIPT"; then echo "Live: ${PAGES_URL} serves ${ENTRY_SCRIPT}"; exit 0; fi
            sleep 10
          done
          echo "::error::${PAGES_URL} did not serve ${ENTRY_SCRIPT} within 5 minutes"; exit 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile --filter tazumo
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the deployed preview
        run: pnpm exec playwright test -c tests/pages/playwright.config.ts
      - name: Summary
        if: always()
        env:
          SMOKE_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Pages preview for ${GITHUB_SHA}: smoke ${SMOKE_STATUS}"
            echo "Deployed evidence: Playwright Chromium against ${PAGES_URL} (synthetic demo data; no real orders, payments or delivery)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pages-smoke
          path: test-results/pages/
          if-no-files-found: warn
          retention-days: 14
