name: Dependency security review
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependency-audit:
    runs-on: ${{ (vars.RUNNER_MODE == 'hosted' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","demos"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Classify changed files
        id: changes
        run: node scripts/ci-changes.mjs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.deps == 'true'
        with:
          version: 10.11.0
      - if: steps.changes.outputs.deps == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.deps == 'true'
        run: pnpm audit --audit-level high
      - if: steps.changes.outputs.deps != 'true'
        run: echo "No dependency manifest changed in this pull request; the audit runs on every push to main and weekly." >> "$GITHUB_STEP_SUMMARY"
