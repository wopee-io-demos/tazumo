name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '45 5 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/gitleaks.toml"
          if [ "$EVENT" = pull_request ] && git cat-file -e "$PR_BASE:.github/gitleaks.toml" 2>/dev/null; then
            git show "$PR_BASE:.github/gitleaks.toml" > "$config"
            echo "Allowlist: .github/gitleaks.toml from the base commit $PR_BASE"
          else
            cp .github/gitleaks.toml "$config"
            echo "Allowlist: .github/gitleaks.toml from the checked-out commit"
          fi
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$GITHUB_SHA"
              else
                range="$GITHUB_SHA"
              fi ;;
            *) range="$GITHUB_SHA" ;;
          esac
          echo "Scanning git log $range"
          rm -f .gitleaksignore
          "$RUNNER_TEMP/gitleaks" git --config "$config" --log-opts="$range" \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP" \
            --redact --verbose --no-color --no-banner --exit-code 1 .
