name: Native development builds
on:
  pull_request:
    paths:
      - '.github/workflows/native-builds.yml'
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.npmrc'
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Native-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      smoke: ${{ steps.diff.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed" | sed 's/^/  /'
          native='^(apps/mobile/(app\.json|package\.json|eas\.json|(babel|metro)\.config\.[^/]+)$|apps/mobile/(assets|plugins)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.github/workflows/native-builds\.yml$)'
          smoke='^(apps/mobile/(src|tests)/|apps/mobile/index\.ts$|packages/core/)'
          if printf '%s\n' "$changed" | grep -Eq "$native"; then n=true; else n=false; fi
          if [ "$n" = true ] || printf '%s\n' "$changed" | grep -Eq "$smoke"; then m=true; else m=false; fi
          echo "native=$n" >> "$GITHUB_OUTPUT"
          echo "smoke=$m" >> "$GITHUB_OUTPUT"
          echo "native=$n smoke=$m"
  android:
    name: Android debug APK
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  android-smoke:
    name: Android emulator smoke
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.smoke == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release-variant APK (debug keystore, x86_64, embedded JS bundle)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke path on the emulator (browse, product, add, cart)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apps/mobile/tests/android-smoke.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ runner.temp }}/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-android-smoke
          path: |
            ${{ runner.temp }}/android-smoke/
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  ios:
    name: iOS simulator build
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ${{ ((vars.RUNNER_MODE == 'hosted' && vars.IOS_RUNNER != 'self-hosted') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'macos-15' || fromJSON('["self-hosted","macOS","mac-ios"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform ios --non-interactive --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile simulator application
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Tazumo.xcworkspace -scheme Tazumo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/tazumo-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/tazumo-ios/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/tazumo-ios-simulator.zip" Tazumo.app
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-ios-simulator-app
          path: tazumo-ios-simulator.zip
          retention-days: 7
