name: Native development builds
on:
  pull_request:
    paths:
      - '.github/workflows/native-builds.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform ios --non-interactive --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile simulator application
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Tazumo.xcworkspace -scheme Tazumo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/tazumo-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/tazumo-ios/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/tazumo-ios-simulator.zip" Tazumo.app
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-ios-simulator-app
          path: tazumo-ios-simulator.zip
          retention-days: 7
