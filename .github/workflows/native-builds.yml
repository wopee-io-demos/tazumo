name: Native development builds
on:
  pull_request:
    paths:
      - '.github/workflows/native-builds.yml'
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.npmrc'
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true
jobs:
  changes:
    name: Native-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      smoke: ${{ steps.diff.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed" | sed 's/^/  /'
          native='^(apps/mobile/(app\.json|package\.json|eas\.json|(babel|metro)\.config\.[^/]+)$|apps/mobile/(assets|plugins)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.github/workflows/native-builds\.yml$)'
          smoke='^(apps/mobile/(src|tests)/|apps/mobile/index\.ts$|packages/core/)'
          if printf '%s\n' "$changed" | grep -Eq "$native"; then n=true; else n=false; fi
          if [ "$n" = true ] || printf '%s\n' "$changed" | grep -Eq "$smoke"; then m=true; else m=false; fi
          echo "native=$n" >> "$GITHUB_OUTPUT"
          echo "smoke=$m" >> "$GITHUB_OUTPUT"
          echo "native=$n smoke=$m"
  android:
    name: Android debug APK
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  android-smoke:
    name: Android emulator smoke
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.smoke == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release-variant APK (debug keystore, x86_64, embedded JS bundle)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke path on the emulator (browse, product, add, cart)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apps/mobile/tests/android-smoke.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ runner.temp }}/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-android-smoke
          path: |
            ${{ runner.temp }}/android-smoke/
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  ios:
    name: iOS simulator build
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    runs-on: ${{ ((vars.RUNNER_MODE == 'hosted' && vars.IOS_RUNNER != 'self-hosted') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'macos-15' || fromJSON('["self-hosted","macOS","mac-ios"]') }}
    timeout-minutes: 90
    env:
      # Hardlinks from the runner's persistent pnpm store keep node_modules file identities stable across runs,
      # so Xcode can reuse DerivedData for the React Native and Expo local pods.
      npm_config_package_import_method: hardlink
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Restore the persistent iOS build cache (self-hosted only)
        id: ios-cache
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        run: |
          key="$(XCODE_VERSION="$(xcodebuild -version)" TOOLCHAIN="$(pod --version) $(node --version)" node apps/mobile/scripts/ios-cache-key.mjs)"
          dir="$HOME/.tazumo-ci-cache/$RUNNER_NAME/ios/$key"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ -d "$dir/ios/Pods" ] && [ -d "$dir/DerivedData/Build" ]; then
            mv "$dir/ios" apps/mobile/ios
            mv "$dir/DerivedData" "$RUNNER_TEMP/tazumo-ios"
            rm -f apps/mobile/ios/.xcode.env.local
            echo "Restored the iOS build cache $key"
          else
            echo "No iOS build cache for $key; building clean"
          fi
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform ios --non-interactive --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile simulator application
        id: compile
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Tazumo.xcworkspace -scheme Tazumo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/tazumo-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/tazumo-ios/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/tazumo-ios-simulator.zip" Tazumo.app
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-ios-simulator-app
          path: tazumo-ios-simulator.zip
          retention-days: 7
      - name: Save the persistent iOS build cache (self-hosted only)
        if: always() && steps.ios-cache.outcome == 'success'
        continue-on-error: true
        env:
          CACHE_DIR: ${{ steps.ios-cache.outputs.dir }}
          COMPILE: ${{ steps.compile.outcome }}
        run: |
          root="$(dirname "$CACHE_DIR")"
          entries() { find "$root" -mindepth 1 -maxdepth 1 -type d -exec stat -f '%m %N' {} + 2>/dev/null | sort -rn | cut -d' ' -f2-; }
          rm -rf "$CACHE_DIR"
          free_kb="$(df -k "$HOME" | awk 'NR==2 {print $4}')"
          if { [ "$COMPILE" = success ] || [ "$COMPILE" = cancelled ]; } && [ "$free_kb" -gt 31457280 ] \
            && [ -d apps/mobile/ios/Pods ] && [ -d "$RUNNER_TEMP/tazumo-ios/Build" ]; then
            mkdir -p "$CACHE_DIR"
            mv apps/mobile/ios "$CACHE_DIR/ios"
            mv "$RUNNER_TEMP/tazumo-ios" "$CACHE_DIR/DerivedData"
          fi
          entries | tail -n +4 | while read -r old; do rm -rf "$old"; done
          while [ "$(entries | wc -l)" -gt 1 ] && [ "$(du -sk "$root" | cut -f1)" -gt 20971520 ]; do
            rm -rf "$(entries | tail -1)"
          done
          du -sh "$root"/*/ 2>/dev/null || true
