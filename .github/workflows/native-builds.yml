name: Native development builds
on:
  pull_request:
    paths:
      - '.github/workflows/native-builds.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
  android-smoke:
    name: Android emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile test
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release-variant APK (debug keystore, x86_64, embedded JS bundle)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke path on the emulator (browse, product, add, cart)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apps/mobile/tests/android-smoke.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk ${{ runner.temp }}/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-android-smoke
          path: |
            ${{ runner.temp }}/android-smoke/
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform ios --non-interactive --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile simulator application
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Tazumo.xcworkspace -scheme Tazumo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/tazumo-ios" CODE_SIGNING_ALLOWED=NO build
          cd "$RUNNER_TEMP/tazumo-ios/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/tazumo-ios-simulator.zip" Tazumo.app
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-ios-simulator-app
          path: tazumo-ios-simulator.zip
          retention-days: 7
