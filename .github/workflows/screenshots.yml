name: SUT screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/capture-web-screenshots.sh'
      - 'tests/screenshots/**'
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  MAESTRO_VERSION: 1.41.0
  MAESTRO_SHA256: 0b87a2eed8c1594fe572c5f29d6d64af389f4b7231ddde714179bbcb05f0fe0c
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
jobs:
  web:
    name: Web (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -q && sudo apt-get install -yq pngquant
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/capture-web-screenshots.sh
        env:
          SCREENSHOT_OUT: screenshots/web
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-screenshots-web
          path: screenshots/web/
          retention-days: 30

  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Pick and boot an iPhone simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available -j | node -e "
            const d=JSON.parse(require('fs').readFileSync(0)).devices;
            const ver=r=>r.split('iOS-')[1].split('-').map(Number);
            const ios=Object.keys(d).filter(r=>r.includes('iOS-')).sort((a,b)=>{const x=ver(a),y=ver(b);return (y[0]-x[0])||((y[1]||0)-(x[1]||0))});
            for(const r of ios){const x=d[r].find(x=>/^iPhone 16( |$)/.test(x.name))||d[r].find(x=>x.name.startsWith('iPhone'));if(x){console.log(x.udid);break}}")"
          test -n "$udid"
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform ios --non-interactive --no-install
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build Release simulator app
        working-directory: apps/mobile/ios
        run: xcodebuild -workspace Tazumo.xcworkspace -scheme Tazumo -configuration Release -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/tazumo-ios" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Install Maestro and pngquant
        run: |
          bash tests/screenshots/native/install-maestro.sh
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pngquant
      - name: Capture
        run: bash tests/screenshots/native/ios.sh "$RUNNER_TEMP/tazumo-ios/Build/Products/Release-iphonesimulator/Tazumo.app" "${{ steps.sim.outputs.udid }}" screenshots/ios
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-screenshots-ios
          path: screenshots/ios/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-maestro-logs-ios
          path: ~/.maestro/tests/
          retention-days: 7

  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tazumo/mobile exec expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release-variant APK (debug keystore, x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro and pngquant
        run: |
          bash tests/screenshots/native/install-maestro.sh
          sudo apt-get update -q && sudo apt-get install -yq pngquant
      - name: Capture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/screenshots/native/android.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk screenshots/android
      - uses: actions/upload-artifact@v4
        with:
          name: tazumo-screenshots-android
          path: screenshots/android/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tazumo-maestro-logs-android
          path: ~/.maestro/tests/
          retention-days: 7
