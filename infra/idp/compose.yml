# Development and CI identity provider (ADR-0017). Not a production deployment.
# Start with `bash infra/idp/up.sh`: it generates the dev-only passwords in infra/idp/.env.
name: ${IDP_PROJECT:-tazumo-idp}

services:
  db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    container_name: ${IDP_PROJECT:-tazumo-idp}-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDP_DB_PASSWORD:?run infra/idp/up.sh}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    container_name: ${IDP_PROJECT:-tazumo-idp}-mail
    ports:
      - 127.0.0.1:${IDP_MAIL_PORT:-48125}:8025

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    container_name: ${IDP_PROJECT:-tazumo-idp}-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDP_DB_PASSWORD:?run infra/idp/up.sh}
      KC_HOSTNAME: http://127.0.0.1:${IDP_PORT:-48180}
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-only-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDP_ADMIN_PASSWORD:?run infra/idp/up.sh}
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - 127.0.0.1:${IDP_PORT:-48180}:8080
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
